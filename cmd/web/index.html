<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cog examples</title>
  <!-- An empty data: icon, so a static server is not asked for a favicon it does not have. -->
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #cfd0d6; font-family: system-ui, -apple-system, sans-serif;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100% !important; height: 100% !important;
      background: #000; touch-action: none; outline: none; }
    #status { position: fixed; left: 50%; top: 50%; z-index: 1;
      width: min(240px, 50vw); height: 2px; overflow: hidden; pointer-events: none;
      background: #cfd0d633; transform: translate(-50%, -50%); }
    #status::after { content: ""; position: absolute; inset-block: 0; width: 40%; background: #cfd0d6;
      animation: loading 1.1s ease-in-out infinite; }
    #status.hidden { display: none; }
    #status.failed::after { inset-inline: 0; width: auto; background: #e06c75; animation: none; }
    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas width="1280" height="720"></canvas>
    <div id="status"></div>
  </div>

  <script src="demo.js"></script>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const canvas = document.querySelector("canvas");

      if (globalThis.__cogDemo) document.title = `cog examples: scene ${globalThis.__cogDemo}`;

      // gogpu binds keydown on the canvas element rather than on the document,
      // so a demo's keyboard does nothing until the canvas can take focus.
      // Every demo here has hotkeys, and a page that swallows them looks like a
      // broken demo rather than a missing tabindex.
      canvas.setAttribute("tabindex", "0");
      canvas.addEventListener("pointerdown", () => canvas.focus());

      // A minimal tar reader: enough of the format to walk ustar headers and
      // keep the regular files. Directory entries are dropped, which is what
      // makes the unpacked map flat and keyed by full path - assets/Fox/Fox.glb
      // - the same spelling a demo names a model by on disk.
      const unpackTar = (bytes) => {
        const files = new Map();
        const decoder = new TextDecoder();
        const text = (start, length) => {
          const field = bytes.subarray(start, start + length);
          const end = field.indexOf(0);
          return decoder.decode(end < 0 ? field : field.subarray(0, end)).trim();
        };
        for (let offset = 0; offset + 512 <= bytes.length;) {
          const name = text(offset, 100);
          if (!name) break;
          const prefix = text(offset + 345, 155);
          const size = parseInt(text(offset + 124, 12), 8) || 0;
          const type = bytes[offset + 156];
          const dataStart = offset + 512;
          if (type === 0 || type === 48) {
            files.set(prefix ? `${prefix}/${name}` : name, bytes.subarray(dataStart, dataStart + size));
          }
          offset = dataStart + Math.ceil(size / 512) * 512;
        }
        if (files.size === 0) throw new Error("assets.tar.gz: empty or invalid archive");
        return files;
      };

      if (!("gpu" in navigator)) {
        status.className = "failed";
        console.error("WebGPU is unavailable");
        return;
      }

      // Fallback for browsers without instantiateStreaming.
      if (!WebAssembly.instantiateStreaming) {
        WebAssembly.instantiateStreaming = async (resp, importObject) => {
          const src = await (await resp).arrayBuffer();
          return await WebAssembly.instantiate(src, importObject);
        };
      }

      const go = new Go();
      try {
        const assetsPromise = fetch("assets.tar.gz").then(async (response) => {
          if (!response.ok) throw new Error(`assets.tar.gz: HTTP ${response.status}`);
          if (!response.body || !("DecompressionStream" in globalThis)) {
            throw new Error("This browser cannot decompress the asset bundle");
          }
          const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
          return unpackTar(new Uint8Array(await new Response(stream).arrayBuffer()));
        });
        const wasmPromise = fetch("main.wasm");
        const [assets, wasmResponse] = await Promise.all([assetsPromise, wasmPromise]);

        // internal/assets takes this once and deletes it, so the decompressed
        // copy is collectable as soon as the module has read what it needs.
        globalThis.__cogAssets = assets;

        let result;
        try {
          // Fast path: needs the server to send Content-Type: application/wasm.
          result = await WebAssembly.instantiateStreaming(wasmResponse.clone(), go.importObject);
        } catch (_) {
          // MIME/type fallback: fetch bytes then instantiate.
          const bytes = await wasmResponse.arrayBuffer();
          result = await WebAssembly.instantiate(bytes, go.importObject);
        }
        status.className = "hidden";
        canvas.focus();
        await go.run(result.instance);
        status.className = "failed";
      } catch (err) {
        status.className = "failed";
        console.error(err);
      }
    })();
  </script>
</body>
</html>
